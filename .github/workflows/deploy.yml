name: Deploy to Cloudflare Pages

# Only runs for commits already on this repository. Deliberately does NOT use
# pull_request or pull_request_target: this repo is public, and those triggers
# are how fork-supplied code gets near deployment credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate content
        # Broken or internally inconsistent content is the one change that
        # leaves the live site showing an error state instead of the index, so
        # it fails here rather than in someone's browser. Same script runs
        # locally: node tools/validate-content.mjs
        run: node tools/validate-content.mjs

      - name: Warn if cached files changed without a cache bump
        # Not fatal, but the most common PWA failure is shipping new content
        # under an old cache name, which leaves installed phones on a stale copy.
        run: |
          if ! git diff --quiet HEAD~1 HEAD -- index.html links.json manifest.webmanifest icons 2>/dev/null; then
            if git diff --quiet HEAD~1 HEAD -- sw.js 2>/dev/null; then
              echo "::warning::Cached files changed but sw.js did not. Bump CACHE_NAME in sw.js so installed devices pick up this deploy."
            fi
          fi
        continue-on-error: true

      - name: Stage the site
        # Only the files the site actually serves. Tooling, the README and CI
        # config stay out of the deployed output.
        run: |
          mkdir -p dist/icons dist/data
          cp index.html links.json manifest.webmanifest sw.js dist/
          cp icons/* dist/icons/
          cp data/*.json dist/data/
          ls -R dist

      - name: Confirm every referenced content file was staged
        # The staging step is a hand-written copy list, so a new content file
        # can be added and silently left out of the deploy. Check the staged
        # tree against what links.json actually references.
        run: |
          node --input-type=module -e '
            import { readFile, access } from "node:fs/promises";
            const index = JSON.parse(await readFile("dist/links.json", "utf8"));
            const refs = index.categories.map((c) => c.file);
            if (index.contacts?.file) refs.push(index.contacts.file);
            let missing = [];
            for (const r of refs) {
              try { await access("dist/" + r); } catch { missing.push(r); }
            }
            if (missing.length) {
              console.error("Referenced but not staged for deploy:");
              for (const m of missing) console.error("  - " + m);
              process.exit(1);
            }
            console.log(`All ${refs.length} referenced content files staged.`);
          '

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=upinfradesk --branch=main
