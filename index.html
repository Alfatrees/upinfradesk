<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPInfradesk — UP Infrastructure &amp; Investment Resource Index</title>
<meta name="description" content="A single, searchable index of public UP infrastructure and investment-facilitation resources — GIS portals, investor systems, policies, and central agency links, with detail on what each one actually gives you.">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F1F0ED; --border:#E3E1DC; --border-strong:#CFCBC2;
  --ink:#181714; --ink-soft:#57544C; --ink-faint:#8B8779;
  --accent:#8C4321; --accent-strong:#6E3419; --accent-on:#FFFFFF; --accent-soft:#F3E2D8;
  --amber:#8A5D08; --amber-bg:#FBEECE; --amber-border:#E9C874;
  --red:#A32A20; --red-bg:#FAE2DF; --red-border:#E7A79C;
  --focus:#8C4321;
  /* Popovers sit on a warm tint so they read as floating above the page
     rather than as another panel belonging to it. */
  --popover-bg:#FDF3EC; --popover-bg-alt:#F8E7DA; --popover-border:#E4BFA6;
  --shadow-float:0 16px 40px -12px rgba(24,23,20,.22), 0 4px 12px -2px rgba(24,23,20,.10);
  --shadow-card:0 1px 2px rgba(24,23,20,.06);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-7:48px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --header-h:60px;
  --sidebar-w:264px;
  color-scheme: light dark;
}
/* Dark palette. Applied when the OS asks for dark (unless an explicit light
   choice overrides it), and again when a host stamps data-theme="dark" on the
   root, so an explicit toggle wins in either direction. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151412; --surface:#1D1B18; --surface-2:#252220; --border:#37342E; --border-strong:#4A473F;
    --ink:#F3F0E9; --ink-soft:#BAB5A8; --ink-faint:#8A8578;
    --accent:#E2916A; --accent-strong:#EFAA88; --accent-on:#20130A; --accent-soft:#3A281E;
    --amber:#E8C15E; --amber-bg:#382C10; --amber-border:#5C4A1C;
    --red:#EE998E; --red-bg:#3A1D19; --red-border:#5E332B;
    --focus:#E2916A;
    --popover-bg:#2A211B; --popover-bg-alt:#332720; --popover-border:#5A4234;
    --shadow-float:0 16px 40px -12px rgba(0,0,0,.65), 0 4px 12px -2px rgba(0,0,0,.5);
    --shadow-card:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#151412; --surface:#1D1B18; --surface-2:#252220; --border:#37342E; --border-strong:#4A473F;
  --ink:#F3F0E9; --ink-soft:#BAB5A8; --ink-faint:#8A8578;
  --accent:#E2916A; --accent-strong:#EFAA88; --accent-on:#20130A; --accent-soft:#3A281E;
  --amber:#E8C15E; --amber-bg:#382C10; --amber-border:#5C4A1C;
  --red:#EE998E; --red-bg:#3A1D19; --red-border:#5E332B;
  --focus:#E2916A;
  --popover-bg:#2A211B; --popover-bg-alt:#332720; --popover-border:#5A4234;
  --shadow-float:0 16px 40px -12px rgba(0,0,0,.65), 0 4px 12px -2px rgba(0,0,0,.5);
  --shadow-card:0 1px 2px rgba(0,0,0,.3);
}

/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
h1,h2,h3,p,ul,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
input{font:inherit}
ul{list-style:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- Layout shell ---------- */
.shell{max-width:960px;margin:0 auto;padding:0 var(--sp-4) var(--sp-7)}
.app-header{
  position:sticky;top:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.app-header-inner{
  padding:0 var(--sp-4);
  height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
}
.header-left{display:flex;align-items:center;gap:var(--sp-2);min-width:0}

/* ---------- Sidebar (F11) ---------- */
#menu-toggle{display:flex}
.sidebar{
  position:fixed;top:var(--header-h);bottom:0;left:0;width:var(--sidebar-w);z-index:50;
  background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;overscroll-behavior:contain;
  padding:var(--sp-4) var(--sp-2) var(--sp-7);
}
.sidebar-heading{
  font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 var(--sp-3);margin-bottom:var(--sp-2);
}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-group-row{display:flex;align-items:stretch;gap:2px;border-radius:var(--radius-sm)}
.side-group-row:hover{background:var(--surface-2)}
.side-link{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);
  padding:0 var(--sp-2) 0 var(--sp-3);min-height:44px;border-radius:var(--radius-sm);
  font-size:.9375rem;font-weight:600;text-decoration:none;color:var(--ink);text-align:left;
}
.side-link .side-count{font-size:.75rem;font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:none}
.side-group.is-current > .side-group-row{background:var(--accent-soft)}
.side-group.is-current > .side-group-row .side-link{color:var(--accent-strong)}
.side-toggle{
  flex:none;width:36px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);color:var(--ink-faint);
}
.side-toggle svg{width:16px;height:16px;transition:transform .18s ease}
.side-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.side-toggle:hover{color:var(--ink)}
.side-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 var(--sp-2) 0;padding-left:var(--sp-4)}
.side-sub[hidden]{display:none}
.side-sub a{
  display:block;padding:8px var(--sp-3);min-height:36px;border-radius:var(--radius-sm);
  font-size:.8125rem;line-height:1.35;color:var(--ink-soft);text-decoration:none;
  border-left:2px solid var(--border);
}
.side-sub a:hover{background:var(--surface-2);color:var(--ink);border-left-color:var(--border-strong)}
.side-sub a.is-current{color:var(--accent-strong);border-left-color:var(--accent);font-weight:500}
.sidebar-empty{padding:var(--sp-3);font-size:.8125rem;color:var(--ink-faint)}
.side-group-extra{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border)}
#sidebar-scrim{display:none}

/* Desktop: sidebar always visible, content offset. Collapsing hides it. */
@media (min-width:1024px){
  body:not(.sidebar-collapsed) .content-area{margin-left:var(--sidebar-w)}
  body.sidebar-collapsed .sidebar{display:none}
  .app-footer{transition:margin-left .001s}
  body:not(.sidebar-collapsed) .app-footer{margin-left:var(--sidebar-w)}
}

/* Mobile/tablet: off-canvas drawer behind a scrim. */
@media (max-width:1023px){
  .sidebar{
    width:min(84vw,320px);transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--shadow-float);
  }
  body.sidebar-open .sidebar{transform:translateX(0)}
  body.sidebar-open #sidebar-scrim{
    display:block;position:fixed;inset:var(--header-h) 0 0 0;z-index:45;
    background:rgba(24,23,20,.45);
  }
  body.sidebar-open{overflow:hidden}
}
@media (prefers-reduced-motion: reduce){
  .sidebar{transition:none}
}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-size:1.125rem;letter-spacing:-.015em}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--accent) 0%,var(--accent-strong) 100%);
  color:var(--accent-on);
  box-shadow:0 1px 2px rgba(24,23,20,.18), inset 0 1px 0 rgba(255,255,255,.18);
}
.brand-mark svg{width:20px;height:20px}
.brand-word{font-weight:500;color:var(--ink-soft)}
.brand-word-accent{font-weight:700;color:var(--ink)}
.header-actions{display:flex;align-items:center;gap:var(--sp-2)}
.icon-btn{
  display:flex;align-items:center;gap:var(--sp-1);min-width:48px;min-height:48px;padding:0 var(--sp-3);
  border-radius:var(--radius-sm);color:var(--ink-soft);transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.flagged{color:var(--red);font-weight:600;font-size:.875rem}
.icon-btn.flagged.is-active{background:var(--red-bg);color:var(--red)}

/* ---------- Offline bar ---------- */
#offline-bar{
  background:var(--amber-bg);color:var(--amber);border-bottom:1px solid var(--amber-border);
  font-size:.875rem;font-weight:500;padding:var(--sp-2) var(--sp-4);text-align:center;
}
#offline-bar[hidden]{display:none}

/* ---------- Pinned strip ---------- */
.pinned-section{padding-top:var(--sp-5)}
.section-label{
  font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  margin-bottom:var(--sp-2);display:block;
}
.pinned-scroll{
  display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:var(--sp-2);scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.pinned-scroll::-webkit-scrollbar{height:6px}
.pinned-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.pin-chip{
  scroll-snap-align:start;flex:none;display:flex;align-items:center;gap:var(--sp-2);
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:var(--sp-2) var(--sp-4);font-size:.875rem;font-weight:500;min-height:48px;
  white-space:nowrap;transition:border-color .15s,transform .1s;
}
.pin-chip:hover{border-color:var(--border-strong)}
.pin-chip:active{transform:scale(.97)}
.pin-chip svg{width:14px;height:14px;color:var(--ink-faint);flex:none}

/* ---------- Search ---------- */
.search-wrap{
  position:sticky;top:var(--header-h);z-index:30;background:var(--bg);
  padding:var(--sp-4) 0;
}
.search-field{
  position:relative;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);
}
.search-field svg{width:20px;height:20px;color:var(--ink-faint);position:absolute;left:var(--sp-4);pointer-events:none}
#search{
  width:100%;background:transparent;border:0;padding:14px var(--sp-4) 14px 46px;
  font-size:1rem;color:var(--ink);min-height:48px;border-radius:var(--radius-md);
}
#search::placeholder{color:var(--ink-faint)}
#search-clear{
  position:absolute;right:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:999px;color:var(--ink-faint);
}
#search-clear[hidden]{display:none}
#search-clear:hover{background:var(--surface-2);color:var(--ink)}
#search-status{font-size:.8125rem;color:var(--ink-faint);padding:var(--sp-2) var(--sp-1) 0}

/* ---------- Categories ---------- */
.category{border-bottom:1px solid var(--border)}
.category:last-child{border-bottom:0}
.category-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-4) var(--sp-1);min-height:48px;text-align:left;
}
.category-toggle-left{display:flex;align-items:center;gap:var(--sp-2)}
.category-toggle svg.chev{width:18px;height:18px;color:var(--ink-faint);transition:transform .18s ease}
.category[data-collapsed="true"] .category-toggle svg.chev{transform:rotate(-90deg)}
.category-title{font-size:1.125rem;font-weight:700;letter-spacing:-.005em}
.category-count{font-size:.8125rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.category-body{padding-bottom:var(--sp-5)}
.category[data-collapsed="true"] .category-body{display:none}

.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-3);
}

/* ---------- Link card ---------- */
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-card);transition:border-color .15s,transform .1s;
}
.card:hover{border-color:var(--border-strong)}
.card.is-open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-link{
  display:block;padding:var(--sp-4);padding-bottom:var(--sp-2);text-decoration:none;min-height:48px;border-radius:var(--radius-md) var(--radius-md) 0 0;
}
.card-title{font-size:1.0625rem;font-weight:600;letter-spacing:-.005em;margin-bottom:2px}
.card-note{font-size:.875rem;color:var(--ink-soft);line-height:1.4}
.card-deprecated .card-title{text-decoration:line-through;color:var(--ink-faint)}
.card-deprecated-note{font-size:.75rem;color:var(--red);padding:0 var(--sp-4);margin-top:2px}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3) var(--sp-3)}
.badges{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.badge{
  display:inline-flex;align-items:center;gap:3px;font-size:.6875rem;font-weight:600;
  padding:3px 7px;border-radius:6px;line-height:1.3;white-space:nowrap;
}
.badge svg{width:11px;height:11px}
.badge-lock{background:var(--surface-2);color:var(--ink-soft)}
.badge-desktop{background:var(--surface-2);color:var(--ink-soft)}
.badge-verify{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-stale{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.card-buttons{display:flex;align-items:center;gap:0}
.card-btn{
  width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);
  color:var(--ink-faint);transition:background .15s,color .15s;
}
.card-btn svg{width:16px;height:16px}
.card-btn:hover{background:var(--surface-2);color:var(--ink)}
.card-btn.is-active{color:var(--accent)}
.card-btn[aria-pressed="true"] svg{transform:rotate(180deg)}

/* mobile inline detail (chevron expand) — same warm tint as the floating
   panel, so the expanded detail reads as the same kind of thing on a phone */
.card-inline-detail{display:none;border-top:1px solid var(--popover-border);background:var(--popover-bg)}
.card-inline-detail.is-open{display:block}
.card-inline-detail .detail-head{border-radius:0}
.card{overflow:hidden}

/* ---------- Detail panel (floating, desktop) ---------- */
.detail-panel{
  position:fixed;z-index:70;width:320px;max-height:min(520px,80vh);overflow-y:auto;
  background:var(--popover-bg);border:1px solid var(--popover-border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-float);padding:0;
}
.detail-panel[hidden]{display:none}
.detail-block + .detail-block{border-top:1px solid var(--popover-border)}
.detail-block{padding:var(--sp-3) var(--sp-4)}
.detail-head{padding:var(--sp-4);padding-bottom:var(--sp-3);background:var(--popover-bg-alt)}
.detail-title{font-size:1rem;font-weight:700;margin-bottom:2px}
.detail-owner{font-size:.8125rem;color:var(--ink-faint)}
.detail-label{font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:var(--sp-1)}
.detail-text{font-size:.875rem;line-height:1.5;color:var(--ink-soft)}
.detail-tags{font-size:.875rem;line-height:1.6;color:var(--ink-soft)}
.detail-quirks{margin:0;padding:0}
.detail-quirks li{font-size:.8125rem;line-height:1.5;color:var(--ink-soft);padding-left:var(--sp-4);position:relative;margin-bottom:2px}
.detail-quirks li::before{content:"";position:absolute;left:2px;top:.6em;width:4px;height:4px;border-radius:50%;background:var(--amber)}
.detail-related{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.detail-related button{
  font-size:.8125rem;font-weight:500;color:var(--accent-strong);background:var(--accent-soft);
  padding:4px 10px;border-radius:999px;
}
.detail-related button:hover{filter:brightness(.95)}
.detail-meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-faint)}
.detail-warn-head{color:var(--amber);font-weight:700}

/* ---------- Policy table ---------- */
.policy-wrap{overflow-x:auto}
.policy-table{width:100%;border-collapse:collapse;font-size:.875rem}
.policy-table caption{text-align:left;margin-bottom:var(--sp-2);font-size:.8125rem;color:var(--ink-faint)}
.policy-table th{
  text-align:left;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-faint);padding:var(--sp-2) var(--sp-3);border-bottom:2px solid var(--border-strong);white-space:nowrap;
}
.policy-table th button{display:inline-flex;align-items:center;gap:4px;min-height:32px}
.policy-table th button svg{width:12px;height:12px;opacity:.5}
.policy-table th[aria-sort="ascending"] button svg,.policy-table th[aria-sort="descending"] button svg{opacity:1;color:var(--accent)}
.policy-table td{padding:var(--sp-3);border-bottom:1px solid var(--border);vertical-align:top}
.policy-table tbody tr:hover{background:var(--surface-2)}
.policy-table tbody tr.is-open{background:var(--accent-soft)}
.policy-doc-cell{display:flex;align-items:flex-start;gap:var(--sp-2)}
.policy-doc-title{font-weight:600}
.policy-doc-title.is-amendment{font-weight:500;font-size:.8125rem;color:var(--ink-soft)}
.policy-indent{display:inline-block;width:18px;flex:none;position:relative}
.policy-indent::before{content:"↳";position:absolute;left:0;color:var(--ink-faint)}
.policy-date{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.policy-date.is-empty{color:var(--ink-faint);font-style:italic}
.policy-doc-link{
  display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--radius-sm);
  color:var(--ink-faint);
}
.policy-doc-link:hover{background:var(--surface-2);color:var(--accent)}
.policy-doc-link.indirect{color:var(--amber)}
.policy-doc-link svg{width:16px;height:16px}

/* stacked cards on narrow screens */
@media (max-width:600px){
  .policy-table thead{display:none}
  .policy-table, .policy-table tbody, .policy-table tr, .policy-table td{display:block;width:100%}
  .policy-table tr{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:var(--sp-3);padding:var(--sp-3);background:var(--surface)}
  .policy-table td{border:0;padding:2px 0}
  .policy-table td[data-label]::before{content:attr(data-label) ": ";font-size:.6875rem;font-weight:700;text-transform:uppercase;color:var(--ink-faint)}
  .policy-table td.policy-doc-cell-wrap{padding-bottom:var(--sp-2)}
  .policy-doc-cell{align-items:center}
}

/* ---------- Footer ---------- */
.app-footer{
  margin-top:var(--sp-7);padding:var(--sp-5) var(--sp-1);border-top:1px solid var(--border);
  font-size:.8125rem;color:var(--ink-faint);text-align:center;line-height:1.6;
}
.app-footer strong{color:var(--ink-soft);font-weight:500}

/* ---------- Instructions view ---------- */
#instructions-view{max-width:720px;margin:0 auto;padding:var(--sp-5) var(--sp-4) var(--sp-7)}
#instructions-view[hidden]{display:none}
.instr-back{display:inline-flex;align-items:center;gap:var(--sp-1);font-weight:500;color:var(--accent-strong);margin-bottom:var(--sp-5);min-height:44px}
.instr-back svg{width:16px;height:16px}
#instructions-view h1{font-size:1.5rem;font-weight:700;margin-bottom:var(--sp-5)}
.instr-section{margin-bottom:var(--sp-5)}
.instr-section h2{font-size:1.0625rem;font-weight:700;margin-bottom:var(--sp-2)}
.instr-section p,.instr-section li{font-size:.9375rem;line-height:1.6;color:var(--ink-soft);margin-bottom:var(--sp-2)}
.instr-section ul{padding-left:var(--sp-4);list-style:disc}
.instr-section code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-family:var(--font-mono);font-size:.85em;color:var(--ink)}
.instr-badge-list{list-style:none;padding:0}
.instr-badge-list li{display:flex;align-items:center;gap:var(--sp-2)}

/* ---------- Contacts view (F12) ---------- */
#contacts-view{max-width:900px;margin:0 auto;padding:var(--sp-5) var(--sp-4) var(--sp-7)}
#contacts-view[hidden]{display:none}
#contacts-view h1{font-size:1.5rem;font-weight:700;margin-bottom:var(--sp-2)}
.contacts-lede{font-size:.9375rem;color:var(--ink-soft);line-height:1.6;margin-bottom:var(--sp-4);max-width:62ch}
.contacts-source{
  background:var(--popover-bg);border:1px solid var(--popover-border);border-radius:var(--radius-md);
  padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-5);font-size:.8125rem;color:var(--ink-soft);line-height:1.6;
}
.contacts-source a{color:var(--accent-strong);font-weight:500}
.contacts-source .src-line{display:block}
.office-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--sp-4);margin-bottom:var(--sp-5);
}
.office-card dl{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-4);font-size:.875rem;margin:0}
.office-card dt{font-weight:600;color:var(--ink-faint);white-space:nowrap}
.office-card dd{margin:0;color:var(--ink)}
.contact-group{margin-bottom:var(--sp-5)}
.contact-group h2{font-size:1.0625rem;font-weight:700;margin-bottom:var(--sp-2)}
.contacts-table{width:100%;border-collapse:collapse;font-size:.875rem}
.contacts-table th{
  text-align:left;font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-faint);padding:var(--sp-2) var(--sp-3);border-bottom:2px solid var(--border-strong);
}
.contacts-table td{padding:var(--sp-3);border-bottom:1px solid var(--border);vertical-align:top}
.contacts-table tbody tr:hover{background:var(--surface-2)}
.contact-name{font-weight:600}
.contact-note{display:block;font-size:.75rem;color:var(--ink-faint);margin-top:2px;line-height:1.4}
.contacts-table a{color:var(--accent-strong);word-break:break-word}
.contact-na{color:var(--ink-faint);font-style:italic}
.contact-tel{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:700px){
  .contacts-table thead{display:none}
  .contacts-table, .contacts-table tbody, .contacts-table tr, .contacts-table td{display:block;width:100%}
  .contacts-table tr{
    border:1px solid var(--border);border-radius:var(--radius-md);
    margin-bottom:var(--sp-3);padding:var(--sp-3);background:var(--surface);
  }
  .contacts-table td{border:0;padding:2px 0}
  .contacts-table td[data-label]::before{
    content:attr(data-label) ": ";font-size:.6875rem;font-weight:700;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .office-card dl{grid-template-columns:1fr;gap:2px}
  .office-card dt{margin-top:var(--sp-2)}
}

/* ---------- Empty / error states ---------- */
.state-block{text-align:center;padding:var(--sp-7) var(--sp-4);color:var(--ink-soft)}
.state-block h2{font-size:1.125rem;margin-bottom:var(--sp-2);color:var(--ink)}
.state-block button{margin-top:var(--sp-4);display:inline-flex;min-height:44px;padding:0 var(--sp-4);align-items:center;background:var(--accent);color:var(--accent-on);border-radius:var(--radius-sm);font-weight:600}
</style>

<template id="icon-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></template>
<template id="icon-chevron-down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></template>

<script>
"use strict";
(function(){

/* ============================================================
   UPInfradesk — app logic
   Single-file per spec: no build step, no external dependencies,
   no innerHTML with data-derived content — DOM built via
   createElement/textContent, icons cloned from static <template>s.
   ============================================================ */

/* ---------------- Tiny DOM helpers ---------------- */

function icon(name){
  var tpl = document.getElementById("icon-" + name);
  var svg = tpl.content.firstElementChild.cloneNode(true);
  svg.setAttribute("aria-hidden", "true");
  return svg;
}
function el(tag, className, text){
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

var state = {
  data: null,
  collapsed: loadJSON("upinfradesk:collapsed", {}),
  pins: loadJSON("upinfradesk:pins", []),
  query: "",
  flaggedOnly: false,
  policySort: { key: "lastAmendedDate", dir: "desc" },
  openDetailId: null,
  hoverTimer: null,
  closeTimer: null,
  openEl: null,
  pointerX: 0,
  pointerY: 0,
  linkIndex: null,
  sideOpen: loadJSON("upinfradesk:sideOpen", {}),
  sidebarCollapsed: loadJSON("upinfradesk:sidebarCollapsed", false),
  sectionObserver: null
};

function loadJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage unavailable — pins/collapse state just won't persist */ }
}

/* ---------------- Data load ---------------- */

function init(){
  wireStaticUI();
  wireSidebar();
  fetchData();
  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* offline support degrades gracefully without it */ });
  }
  window.addEventListener("online", updateOfflineBar);
  window.addEventListener("offline", updateOfflineBar);
  updateOfflineBar();
}

function setData(json){
  state.data = json;
  state.linkIndex = null; // rebuilt lazily; must not survive a data swap
  renderAll();
}

function getJSON(path){
  return fetch(path, { cache: "no-cache" })
    .then(function(res){
      if (!res.ok) throw new Error(path + " — HTTP " + res.status + " " + res.statusText);
      return res.text();
    })
    .then(function(text){
      try { return JSON.parse(text); }
      catch(e){ throw new Error(path + " is not valid JSON: " + e.message); }
    });
}

function fetchData(){
  // Single-file review builds embed the whole dataset directly so the page works
  // with no server alongside it. The deployed site has no such tag and always
  // fetches from disk.
  var embedded = document.getElementById("embedded-links-data");
  if (embedded){
    try {
      setData(JSON.parse(embedded.textContent));
      return;
    } catch(e){
      renderLoadError(new Error("Embedded link data is not valid JSON: " + e.message));
      return;
    }
  }

  // links.json is an index; each category's entries live in its own file so no
  // single file grows unwieldy. They are fetched in parallel and merged.
  getJSON("links.json")
    .then(function(index){
      var cats = index.categories || [];
      return Promise.all(cats.map(function(c){ return getJSON(c.file); }))
        .then(function(parts){
          var merged = [];
          parts.forEach(function(p){ merged = merged.concat(p.links || []); });
          index.links = merged;
          return index;
        });
    })
    .then(setData)
    .catch(renderLoadError);
}

function fetchContacts(){
  if (state.contacts) return Promise.resolve(state.contacts);
  var embedded = document.getElementById("embedded-contacts-data");
  if (embedded){
    state.contacts = JSON.parse(embedded.textContent);
    return Promise.resolve(state.contacts);
  }
  var ref = (state.data && state.data.contacts) || { file: "data/contacts.json" };
  return getJSON(ref.file).then(function(c){ state.contacts = c; return c; });
}

function renderLoadError(err){
  var el2 = document.getElementById("load-state");
  el2.textContent = "";
  var block = el("div", "state-block");
  block.appendChild(el("h2", null, "Couldn't load the resource index"));
  block.appendChild(el("p", null, String(err && err.message ? err.message : err)));
  var btn = el("button", null, "Retry");
  btn.type = "button";
  btn.addEventListener("click", function(){ el2.textContent = ""; fetchData(); });
  block.appendChild(btn);
  el2.appendChild(block);
}

/* ---------------- Offline bar (F7) ---------------- */

function updateOfflineBar(){
  var bar = document.getElementById("offline-bar");
  if (!navigator.onLine){
    var asOf = state.data ? formatDate(state.data.lastReviewed) : "";
    bar.textContent = "You're offline. Showing the cached index" + (asOf ? " as of " + asOf : "") + ". Destination links need a connection.";
    bar.hidden = false;
  } else {
    bar.hidden = true;
  }
}

/* ---------------- Static UI wiring ---------------- */

function wireStaticUI(){
  var search = document.getElementById("search");
  var clearBtn = document.getElementById("search-clear");

  var fineHover = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (fineHover) search.focus();

  search.addEventListener("input", function(){
    state.query = search.value;
    clearBtn.hidden = state.query.length === 0;
    renderCategories();
  });
  search.addEventListener("keydown", function(e){
    if (e.key === "Escape" && search.value){
      search.value = "";
      state.query = "";
      clearBtn.hidden = true;
      renderCategories();
    }
  });
  clearBtn.addEventListener("click", function(){
    search.value = ""; state.query = ""; clearBtn.hidden = true; search.focus(); renderCategories();
  });

  document.getElementById("flagged-toggle").addEventListener("click", function(){
    state.flaggedOnly = !state.flaggedOnly;
    this.setAttribute("aria-pressed", String(state.flaggedOnly));
    this.classList.toggle("is-active", state.flaggedOnly);
    renderCategories();
  });

  document.getElementById("instructions-open").addEventListener("click", openInstructions);
  document.getElementById("contacts-open").addEventListener("click", openContacts);

  document.addEventListener("keydown", function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "i" || e.key === "?"){
      var card = document.activeElement && document.activeElement.closest && document.activeElement.closest(".card");
      if (card){ e.preventDefault(); toggleDetailForCard(card); }
    } else if (e.key === "Escape"){
      closeFloatingPanel();
    }
  });

  window.addEventListener("scroll", function(){ if (state.openDetailId) closeFloatingPanel(); }, { passive: true });
  window.addEventListener("resize", function(){ if (state.openDetailId) closeFloatingPanel(); });
}

/* ---------------- Rendering: top level ---------------- */

function renderAll(){
  renderFooter();
  renderPinned();
  renderCategories();
}

function renderFooter(){
  var asof = document.getElementById("footer-asof");
  asof.textContent = " Data as of " + formatDate(state.data.lastReviewed) + ".";
}

function formatDate(iso){
  if (!iso) return "unknown";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

/* ---------------- Staleness (F6) ---------------- */

function stalenessOf(link){
  if (!link.lastVerified) return "none";
  var interval = link.reviewIntervalDays || state.data.defaultReviewIntervalDays || 90;
  var last = new Date(link.lastVerified + "T00:00:00").getTime();
  var days = (Date.now() - last) / 86400000;
  if (days > interval * 2) return "stale";
  if (days > interval) return "verify";
  return "none";
}

function allLinksFlat(){
  return state.data.links || [];
}

function linkById(id){
  if (!state.linkIndex){
    state.linkIndex = {};
    allLinksFlat().forEach(function(l){ state.linkIndex[l.id] = l; });
  }
  return state.linkIndex[id];
}

/* ---------------- Search matching (F1) ---------------- */

function normalizeStr(s){
  // U+0300-U+036F is the combining diacritical marks block. Written as escapes,
  // not literal characters: if this file is ever served or saved under a
  // non-UTF-8 charset, literal combining marks decode into an invalid range and
  // the SyntaxError takes down the whole script — a blank page with no output.
  return (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function linkMatches(link, catLabel, q){
  if (!q) return true;
  var hay = [
    link.title, catLabel,
    (link.tags || []).join(" "),
    link.note,
    link.detail && link.detail.whatItGives,
    link.detail && (link.detail.dataFields || []).join(" ")
  ].join(" ");
  return normalizeStr(hay).indexOf(normalizeStr(q)) !== -1;
}

/* ---------------- Pinned strip (F4) ---------------- */

function renderPinned(){
  var section = document.getElementById("pinned-section");
  var scroll = document.getElementById("pinned-scroll");
  var byId = {};
  allLinksFlat().forEach(function(l){ byId[l.id] = l; });

  var ids = [];
  allLinksFlat().forEach(function(l){ if (l.pinned && ids.indexOf(l.id) === -1) ids.push(l.id); });
  state.pins.forEach(function(id){ if (byId[id] && ids.indexOf(id) === -1) ids.push(id); });

  scroll.textContent = "";
  if (ids.length === 0){ section.hidden = true; return; }
  section.hidden = false;

  ids.forEach(function(id){
    var link = byId[id];
    if (!link || link.deprecated) return;
    var chip = el("button", "pin-chip");
    chip.type = "button";
    chip.appendChild(icon("external"));
    chip.appendChild(el("span", null, link.title));
    chip.addEventListener("click", function(){ window.open(link.url, "_blank", "noopener,noreferrer"); });
    scroll.appendChild(chip);
  });
}

function togglePin(id){
  var i = state.pins.indexOf(id);
  if (i === -1) state.pins.push(id); else state.pins.splice(i, 1);
  saveJSON("upinfradesk:pins", state.pins);
  renderPinned();
}

/* ---------------- Categories + cards (F2, F3) ---------------- */

function renderCategories(){
  var root = document.getElementById("categories");
  root.textContent = "";
  var q = state.query.trim();

  var cats = (state.data.categories || []).slice().sort(function(a,b){ return a.order - b.order; });
  var flaggedTotal = 0;
  var sidebarModel = [];

  cats.forEach(function(cat){
    var links = allLinksFlat().filter(function(l){ return l.category === cat.id; });

    var visible = links.filter(function(l){
      if (!linkMatches(l, cat.label, q)) return false;
      if (state.flaggedOnly && (l.deprecated || stalenessOf(l) === "none")) return false;
      return true;
    });

    links.forEach(function(l){ if (!l.deprecated && stalenessOf(l) !== "none") flaggedTotal++; });

    if (visible.length === 0) return;

    sidebarModel.push({ cat: cat, links: visible });

    var section = el("section", "category");
    section.dataset.catId = cat.id;
    section.id = "cat-" + cat.id;
    var collapsedState = !!state.collapsed[cat.id];
    section.dataset.collapsed = String(collapsedState && !q);

    var toggle = el("button", "category-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", String(!(collapsedState && !q)));
    var toggleLeft = el("span", "category-toggle-left");
    var chev = icon("chevron-down"); chev.classList.add("chev");
    toggleLeft.appendChild(chev);
    toggleLeft.appendChild(el("span", "category-title", cat.label));
    toggle.appendChild(toggleLeft);
    toggle.appendChild(el("span", "category-count", String(visible.length)));
    toggle.addEventListener("click", function(){
      var nowCollapsed = section.dataset.collapsed !== "true";
      section.dataset.collapsed = String(nowCollapsed);
      toggle.setAttribute("aria-expanded", String(!nowCollapsed));
      state.collapsed[cat.id] = nowCollapsed;
      saveJSON("upinfradesk:collapsed", state.collapsed);
    });
    section.appendChild(toggle);

    var body = el("div", "category-body");

    if (cat.view === "table"){
      body.appendChild(renderPolicyTable(visible));
    } else {
      var grid = el("div", "card-grid");
      visible.forEach(function(link){ grid.appendChild(buildCard(link)); });
      body.appendChild(grid);
    }
    section.appendChild(body);
    root.appendChild(section);
  });

  document.getElementById("flagged-count").textContent = String(flaggedTotal);

  var status = document.getElementById("search-status");
  if (q){
    var total = root.querySelectorAll(".card, .policy-table tbody tr").length;
    status.textContent = total + (total === 1 ? " result" : " results") + " for “" + q + "”";
  } else {
    status.textContent = "";
  }

  if (root.children.length === 0){
    var empty = el("div", "state-block");
    empty.appendChild(el("h2", null, q ? "No matches" : "Nothing to show"));
    empty.appendChild(el("p", null, q
      ? "Try a different term — search also matches tags and the data fields inside each resource."
      : "Turn off “flagged only” to see the full index."));
    root.appendChild(empty);
  }

  renderSidebar(sidebarModel);
}

/* ---------------- Sidebar navigation (F11) ----------------
   Mirrors whatever is currently on the page: filter the index and the sidebar
   narrows with it, so it is always an accurate map rather than a fixed menu. */

function isDesktopLayout(){
  return window.matchMedia && window.matchMedia("(min-width:1024px)").matches;
}

// How much sticky chrome sits above the content at any moment.
function stickyOffset(){
  var header = document.querySelector(".app-header");
  var search = document.querySelector(".search-wrap");
  return (header ? header.offsetHeight : 0) + (search ? search.offsetHeight : 0) + 8;
}

function scrollToAnchor(id){
  // The sidebar stays available on the Instructions and Contacts pages, so a
  // jump from either has to bring the index back before the target exists.
  if (document.getElementById("index-view").hidden) showView("index");

  var target = document.getElementById(id);
  if (!target) return;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var y = window.pageYOffset + target.getBoundingClientRect().top - stickyOffset();
  window.scrollTo({ top: Math.max(0, y), behavior: reduce ? "auto" : "smooth" });
  // Move focus for screen-reader and keyboard users, without a second jump.
  target.setAttribute("tabindex", "-1");
  target.focus({ preventScroll: true });
}

function renderSidebar(model){
  var nav = document.getElementById("side-nav");
  nav.textContent = "";

  if (!model.length){
    nav.appendChild(el("div", "sidebar-empty", "Nothing matches the current filter."));
    return;
  }

  model.forEach(function(entry){
    var cat = entry.cat;
    var group = el("div", "side-group");
    group.dataset.catId = cat.id;

    var row = el("div", "side-group-row");

    var link = el("a", "side-link");
    link.href = "#cat-" + cat.id;
    link.appendChild(el("span", null, cat.label));
    link.appendChild(el("span", "side-count", String(entry.links.length)));
    link.addEventListener("click", function(e){
      e.preventDefault();
      scrollToAnchor("cat-" + cat.id);
      if (!isDesktopLayout()) closeSidebar();
    });
    row.appendChild(link);

    var expanded = !!state.sideOpen[cat.id];
    var toggle = el("button", "side-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", String(expanded));
    toggle.setAttribute("aria-label", (expanded ? "Hide" : "Show") + " " + cat.label + " resources");
    toggle.appendChild(icon("chevron-down"));
    row.appendChild(toggle);
    group.appendChild(row);

    var sub = el("ul", "side-sub");
    sub.hidden = !expanded;
    entry.links.forEach(function(l){
      var li = el("li");
      var a = el("a", null, l.title);
      a.href = "#link-" + l.id;
      a.addEventListener("click", function(e){
        e.preventDefault();
        scrollToAnchor("link-" + l.id);
        if (!isDesktopLayout()) closeSidebar();
      });
      li.appendChild(a);
      sub.appendChild(li);
    });
    group.appendChild(sub);

    toggle.addEventListener("click", function(){
      var nowOpen = sub.hidden;
      sub.hidden = !nowOpen;
      toggle.setAttribute("aria-expanded", String(nowOpen));
      toggle.setAttribute("aria-label", (nowOpen ? "Hide" : "Show") + " " + cat.label + " resources");
      state.sideOpen[cat.id] = nowOpen;
      saveJSON("upinfradesk:sideOpen", state.sideOpen);
    });

    nav.appendChild(group);
  });

  // Separate destination rather than a section of the index, so it sits apart.
  var extra = el("div", "side-group side-group-extra");
  var extraRow = el("div", "side-group-row");
  var contactsLink = el("a", "side-link");
  contactsLink.href = "#contacts";
  contactsLink.appendChild(el("span", null, "Departments & Contacts"));
  contactsLink.addEventListener("click", function(e){
    e.preventDefault();
    openContacts();
    if (!isDesktopLayout()) closeSidebar();
  });
  extraRow.appendChild(contactsLink);
  extra.appendChild(extraRow);
  nav.appendChild(extra);

  observeSections();
}

/* Highlight whichever section is currently in view. */
function observeSections(){
  if (state.sectionObserver) state.sectionObserver.disconnect();
  if (!("IntersectionObserver" in window)) return;

  state.sectionObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      var id = e.target.dataset.catId;
      document.querySelectorAll(".side-group").forEach(function(g){
        g.classList.toggle("is-current", g.dataset.catId === id);
      });
    });
  }, { rootMargin: "-25% 0px -65% 0px", threshold: 0 });

  document.querySelectorAll(".category").forEach(function(s){ state.sectionObserver.observe(s); });
}

function openSidebar(){
  document.body.classList.add("sidebar-open");
  document.getElementById("sidebar-scrim").hidden = false;
  syncMenuButton();
}

function closeSidebar(){
  document.body.classList.remove("sidebar-open");
  document.getElementById("sidebar-scrim").hidden = true;
  syncMenuButton();
}

function syncMenuButton(){
  var btn = document.getElementById("menu-toggle");
  var shown = isDesktopLayout()
    ? !document.body.classList.contains("sidebar-collapsed")
    : document.body.classList.contains("sidebar-open");
  btn.setAttribute("aria-expanded", String(shown));
  btn.setAttribute("aria-label", shown ? "Hide sections" : "Show sections");
}

function wireSidebar(){
  var btn = document.getElementById("menu-toggle");
  var scrim = document.getElementById("sidebar-scrim");

  if (state.sidebarCollapsed) document.body.classList.add("sidebar-collapsed");

  btn.addEventListener("click", function(){
    if (isDesktopLayout()){
      // On a wide screen the sidebar is permanent furniture; this collapses it.
      var collapsed = document.body.classList.toggle("sidebar-collapsed");
      state.sidebarCollapsed = collapsed;
      saveJSON("upinfradesk:sidebarCollapsed", collapsed);
    } else {
      if (document.body.classList.contains("sidebar-open")) closeSidebar(); else openSidebar();
    }
    syncMenuButton();
  });

  scrim.addEventListener("click", closeSidebar);

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && document.body.classList.contains("sidebar-open")) closeSidebar();
  });

  // Leaving the narrow layout must not strand the drawer/scrim on screen.
  if (window.matchMedia){
    var mq = window.matchMedia("(min-width:1024px)");
    var onChange = function(){ closeSidebar(); syncMenuButton(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  syncMenuButton();
}

function badge(iconName, label, cls){
  var span = el("span", "badge " + cls);
  span.appendChild(icon(iconName));
  span.appendChild(el("span", null, label));
  return span;
}

function buildCard(link){
  var tpl = document.getElementById("tpl-card");
  var node = tpl.content.firstElementChild.cloneNode(true);
  node.dataset.id = link.id;
  node.id = "link-" + link.id;

  var isStale = !link.deprecated && stalenessOf(link);

  var a = node.querySelector(".card-link");
  a.href = link.url;
  a.setAttribute("aria-describedby", "detail-panel");
  node.querySelector(".card-title").textContent = link.title;
  node.querySelector(".card-note").textContent = link.note || "";

  if (link.deprecated){
    node.classList.add("card-deprecated");
    var note = node.querySelector(".card-deprecated-note");
    note.hidden = false;
    note.textContent = link.replacedBy
      ? "Deprecated — replaced. See related links in detail."
      : "Deprecated — no longer current.";
  }

  var badges = node.querySelector(".badges");
  if (link.authRequired) badges.appendChild(badge("lock", "Login required", "badge-lock"));
  if (link.mobileFriendly === false) badges.appendChild(badge("desktop", "Desktop only", "badge-desktop"));
  if (!link.deprecated && isStale === "verify") badges.appendChild(badge("verify", "Verify", "badge-verify"));
  if (!link.deprecated && isStale === "stale") badges.appendChild(badge("stale", "Stale", "badge-stale"));

  var pinBtn = node.querySelector(".pin-btn");
  var isPinned = link.pinned || state.pins.indexOf(link.id) !== -1;
  pinBtn.setAttribute("aria-pressed", String(isPinned));
  if (isPinned) pinBtn.classList.add("is-active");
  pinBtn.addEventListener("click", function(e){
    e.preventDefault();
    togglePin(link.id);
    var nowPinned = state.pins.indexOf(link.id) !== -1;
    this.setAttribute("aria-pressed", String(nowPinned));
    this.classList.toggle("is-active", nowPinned);
  });

  var chevBtn = node.querySelector(".chevron-btn");
  chevBtn.addEventListener("click", function(e){
    e.preventDefault();
    if (hasFinePointer()){
      toggleDetailForCard(node);
    } else {
      toggleInlineDetail(node, link);
    }
  });

  attachHoverDetail(node, link);

  return node;
}

/* ---------------- Detail content (F3a) ---------------- */

function buildDetailBlock(labelText, extraClass){

  if (d.relatedIds && d.relatedIds.length){

      if (!rl) return;
      var btn = el("button", null, rl.title);

      rel.appendChild(btn);

/* Floating panel (desktop hover / keyboard)
   One code path serves both link cards and policy table rows. Cards are narrow
   enough to sit the panel beside them; a full-width table row leaves no room
   either side, so the panel falls back to anchoring near the pointer. */

function hasFinePointer(){
  return !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);
}

function scheduleClose(){
  clearTimeout(state.closeTimer);
  state.closeTimer = setTimeout(function(){
    var panel = document.getElementById("detail-panel");
    if (!panel.matches(":hover")) closeFloatingPanel();
  }, 150);
}

function attachHoverDetail(target, link){
  if (!hasFinePointer()) return;
  target.addEventListener("mouseenter", function(e){
    clearTimeout(state.closeTimer);
    state.pointerX = e.clientX;
    state.pointerY = e.clientY;
    clearTimeout(state.hoverTimer);
    state.hoverTimer = setTimeout(function(){ openFloatingPanel(target, link); }, 300);
  });
  target.addEventListener("mousemove", function(e){
    // Track the cursor only until the panel opens, so the panel does not chase
    // the pointer once it is on screen.
    if (state.openDetailId !== link.id){
      state.pointerX = e.clientX;
      state.pointerY = e.clientY;
    }
  });
  target.addEventListener("mouseleave", function(){
    clearTimeout(state.hoverTimer);
    scheduleClose();
  });
}

function openFloatingPanel(anchorEl, link){
  var panel = document.getElementById("detail-panel");
  populateDetail(panel, link);
  panel.hidden = false;

  // Clear the previous highlight by reference — the highlighted element may be
  // a table row, not a card, so a ".card" selector sweep would strand it lit.
  if (state.openEl && state.openEl !== anchorEl) state.openEl.classList.remove("is-open");
  state.openEl = anchorEl;
  state.openDetailId = link.id;
  anchorEl.classList.add("is-open");

  var margin = 8;
  var rect = anchorEl.getBoundingClientRect();
  var panelW = panel.offsetWidth || 320;
  var panelH = panel.offsetHeight || 320;
  var vw = document.documentElement.clientWidth;
  var vh = document.documentElement.clientHeight;

  var left;
  var fitsRight = rect.right + margin + panelW + margin <= vw;
  var fitsLeft = rect.left - margin - panelW >= margin;

  if (fitsRight){
    left = rect.right + margin;
  } else if (fitsLeft){
    left = rect.left - panelW - margin;
  } else {
    // No room beside the anchor (wide policy rows). Sit beside the cursor
    // instead, so the panel never lands under the pointer itself.
    left = state.pointerX + 20;
    if (left + panelW + margin > vw) left = state.pointerX - panelW - 20;
  }
  left = Math.max(margin, Math.min(left, vw - panelW - margin));

  var top = fitsRight || fitsLeft ? rect.top : state.pointerY + 16;
  top = Math.max(margin, Math.min(top, vh - panelH - margin));

  panel.style.left = left + "px";
  panel.style.top = top + "px";

  panel.onmouseenter = function(){ clearTimeout(state.closeTimer); };
  panel.onmouseleave = scheduleClose;
}

function closeFloatingPanel(){
  clearTimeout(state.hoverTimer);
  clearTimeout(state.closeTimer);
  var panel = document.getElementById("detail-panel");
  panel.hidden = true;
  state.openDetailId = null;
  if (state.openEl){
    state.openEl.classList.remove("is-open");
    state.openEl = null;
  }
}

function toggleDetailForCard(cardEl){
  var id = cardEl.dataset.id;
  if (state.openDetailId === id){ closeFloatingPanel(); return; }
  var link = linkById(id);
  if (link) openFloatingPanel(cardEl, link);
}

/* Inline expand (mobile / touch) */

function toggleInlineDetail(cardEl, link){
  var box = cardEl.querySelector(".card-inline-detail");
  var btn = cardEl.querySelector(".chevron-btn");
  var open = box.classList.contains("is-open");
  if (open){
    box.classList.remove("is-open");
    btn.setAttribute("aria-expanded", "false");
  } else {
    populateDetail(box, link);
    box.classList.add("is-open");
    btn.setAttribute("aria-expanded", "true");
  }
}

/* ---------------- Policy table (F10) ---------------- */

function amendmentOfId(l){ return l.amendmentOf || (l.detail && l.detail.amendmentOf); }

function renderPolicyTable(links){
  function childrenOf(id){ return links.filter(function(l){ return amendmentOfId(l) === id; }); }
  var parents = links.filter(function(l){ return !amendmentOfId(l); });

  var key = state.policySort.key, dir = state.policySort.dir;
  function val(l, k){
    if (k === "title") return l.title || "";
    if (k === "docType") return l.docType || "";
    if (k === "issuingAuthority") return l.issuingAuthority || "";
    if (k === "publishedDate") return l.publishedDate || "";
    if (k === "lastAmendedDate") return l.lastAmendedDate || "";
    return "";
  }
  function cmp(a, b){
    var va = val(a, key), vb = val(b, key);
    if (!va && !vb) return 0;
    if (!va) return 1;
    if (!vb) return -1;
    if (va < vb) return dir === "asc" ? -1 : 1;
    if (va > vb) return dir === "asc" ? 1 : -1;
    return 0;
  }
  parents = parents.slice().sort(cmp);

  var wrap = el("div", "policy-wrap");
  var table = el("table", "policy-table");

  var cols = [
    ["title", "Document"], ["docType", "Type"], ["issuingAuthority", "Authority"],
    ["publishedDate", "Published"], ["lastAmendedDate", "Last Amended"], [null, "Open"]
  ];
  var thead = el("thead");
  var trHead = el("tr");
  cols.forEach(function(c){
    var th = el("th");
    if (!c[0]){
      th.appendChild(el("span", "visually-hidden", c[1]));
      trHead.appendChild(th);
      return;
    }
    var sortDir = key === c[0] ? dir : null;
    th.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : sortDir === "desc" ? "descending" : "none");
    var btn = el("button", null, c[1]);
    btn.type = "button";
    btn.appendChild(icon(sortDir === "asc" ? "sort-asc" : sortDir === "desc" ? "sort-desc" : "sort-none"));
    btn.addEventListener("click", function(){
      if (state.policySort.key === c[0]) state.policySort.dir = state.policySort.dir === "asc" ? "desc" : "asc";
      else state.policySort = { key: c[0], dir: c[0] === "lastAmendedDate" ? "desc" : "asc" };
      renderCategories();
    });
    th.appendChild(btn);
    trHead.appendChild(th);
  });
  thead.appendChild(trHead);
  table.appendChild(thead);

  var tbody = el("tbody");
  parents.forEach(function(p){
    tbody.appendChild(policyRow(p, false));
    childrenOf(p.id).slice().sort(cmp).forEach(function(child){
      tbody.appendChild(policyRow(child, true));
    });
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function policyRow(link, isChild){
  var tr = el("tr");
  tr.dataset.id = link.id;
  tr.id = "link-" + link.id;

  var tdDoc = el("td");
  tdDoc.dataset.label = "Document";
  tdDoc.className = "policy-doc-cell-wrap";
  var wrap = el("div", "policy-doc-cell");
  if (isChild) wrap.appendChild(el("span", "policy-indent"));
  wrap.appendChild(el("span", "policy-doc-title" + (isChild ? " is-amendment" : ""), link.title));
  tdDoc.appendChild(wrap);
  tr.appendChild(tdDoc);

  var tdType = el("td", null, link.docType || "—"); tdType.dataset.label = "Type"; tr.appendChild(tdType);
  var tdAuth = el("td", null, link.issuingAuthority || "—"); tdAuth.dataset.label = "Authority"; tr.appendChild(tdAuth);

  var tdPub = el("td", "policy-date" + (link.publishedDate ? "" : " is-empty"), link.publishedDate ? formatDate(link.publishedDate) : "not recorded");
  tdPub.dataset.label = "Published"; tr.appendChild(tdPub);

  var tdAmend = el("td", "policy-date" + (link.lastAmendedDate ? "" : " is-empty"), link.lastAmendedDate ? formatDate(link.lastAmendedDate) : "—");
  tdAmend.dataset.label = "Last Amended"; tr.appendChild(tdAmend);

  var tdLink = el("td"); tdLink.dataset.label = "Open";
  var a = el("a", "policy-doc-link" + (link.directDocument === false ? " indirect" : ""));
  a.href = link.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", (link.directDocument === false ? "Open landing page for " : "Open document: ") + link.title);
  a.appendChild(icon("external"));
  tdLink.appendChild(a);
  tr.appendChild(tdLink);

  attachHoverDetail(tr, link);

  return tr;
}

/* ---------------- Contacts view (F12) ----------------
   A transcription of the official Invest UP directory. Anything the source does
   not publish is rendered as "Not available" — never inferred, never filled in
   from another source without saying so. */

function showView(which){
  var views = { index: "index-view", instructions: "instructions-view", contacts: "contacts-view" };
  Object.keys(views).forEach(function(k){
    document.getElementById(views[k]).hidden = (k !== which);
  });
  window.scrollTo(0, 0);
}

function closeInstructions(){ showView("index"); }
function closeContacts(){ showView("index"); }

function naSpan(text){
  return el("span", "contact-na", text || "Not available");
}

function contactCell(value, kind, note){
  var td = el("td");
  if (!value){
    td.appendChild(naSpan());
  } else if (kind === "email"){
    value.split(/,\s*/).forEach(function(addr, i){
      if (i) td.appendChild(document.createElement("br"));
      var a = el("a", null, addr);
      a.href = "mailto:" + addr;
      td.appendChild(a);
    });
  } else if (kind === "tel"){
    value.split(/,\s*/).forEach(function(num, i){
      if (i) td.appendChild(document.createElement("br"));
      var a = el("a", "contact-tel", num);
      a.href = "tel:" + num.replace(/[^\d+]/g, "");
      td.appendChild(a);
    });
  } else {
    td.appendChild(document.createTextNode(value));
  }
  if (note) td.appendChild(el("span", "contact-note", note));
  return td;
}

function openContacts(){
  showView("contacts");
  var view = document.getElementById("contacts-view");
  view.textContent = "";
  view.appendChild(el("p", null, "Loading contacts…"));

  fetchContacts().then(function(data){
    view.textContent = "";

    var back = el("button", "instr-back");
    back.type = "button";
    back.appendChild(icon("back"));
    back.appendChild(document.createTextNode(" Back to index"));
    back.addEventListener("click", closeContacts);
    view.appendChild(back);

    view.appendChild(el("h1", null, data.title));
    view.appendChild(el("p", "contacts-lede", data.note));

    // Provenance first: this is transcribed data, and the reader should know
    // exactly what it came from and how old it is before trusting a number.
    var src = el("div", "contacts-source");
    Object.keys(data.source).forEach(function(k){
      var s = data.source[k];
      var line = el("span", "src-line");
      line.appendChild(document.createTextNode("Source: "));
      var a = el("a", null, s.label);
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      line.appendChild(a);
      line.appendChild(document.createTextNode(
        " — that page last updated " + formatDate(s.sourceUpdated)
      ));
      src.appendChild(line);
    });
    src.appendChild(el("span", "src-line", "Transcribed here on " + formatDate(data.transcribedOn) + "."));
    view.appendChild(src);

    // Head office
    var office = data.office;
    var card = el("div", "office-card");
    card.appendChild(el("h2", null, office.name));
    var dl = el("dl");
    function row(term, node){
      dl.appendChild(el("dt", null, term));
      var dd = el("dd");
      if (typeof node === "string") dd.appendChild(document.createTextNode(node));
      else dd.appendChild(node);
      dl.appendChild(dd);
    }
    row("Address", office.address);
    if (office.addressAlt){
      var altWrap = el("span");
      altWrap.appendChild(document.createTextNode(office.addressAlt));
      altWrap.appendChild(el("span", "contact-note", office.addressNote));
      row("Also listed as", altWrap);
    }
    var phoneWrap = el("span");
    office.phones.forEach(function(p, i){
      if (i) phoneWrap.appendChild(document.createElement("br"));
      var a = el("a", "contact-tel", p);
      a.href = "tel:" + p.replace(/[^\d+]/g, "");
      phoneWrap.appendChild(a);
    });
    row("Phone", phoneWrap);
    var hd = el("span");
    var hdA = el("a", "contact-tel", office.helpdesk);
    hdA.href = "tel:" + office.helpdesk.replace(/[^\d+]/g, "");
    hd.appendChild(hdA);
    hd.appendChild(el("span", "contact-note", office.helpdeskHours));
    row("Helpdesk", hd);
    var em = el("a", null, office.email);
    em.href = "mailto:" + office.email;
    row("Email", em);
    card.appendChild(dl);
    view.appendChild(card);

    // Department-wise tables
    data.groups.forEach(function(g){
      var section = el("div", "contact-group");
      section.appendChild(el("h2", null, g.group));

      var table = el("table", "contacts-table");
      var thead = el("thead");
      var hr = el("tr");
      ["Name", "Designation", "Phone", "Email"].forEach(function(h){
        hr.appendChild(el("th", null, h));
      });
      thead.appendChild(hr);
      table.appendChild(thead);

      var tbody = el("tbody");
      g.people.forEach(function(p){
        var tr = el("tr");

        var tdName = el("td");
        tdName.dataset.label = "Name";
        tdName.appendChild(el("span", "contact-name", p.name));
        tr.appendChild(tdName);

        var tdDes = contactCell(p.designation, "text");
        tdDes.dataset.label = "Designation";
        tr.appendChild(tdDes);

        var tdTel = contactCell(p.phone, "tel");
        tdTel.dataset.label = "Phone";
        tr.appendChild(tdTel);

        var emails = p.email || "";
        if (p.emailAlt) emails = emails ? emails + ", " + p.emailAlt : p.emailAlt;
        var tdMail = contactCell(emails, "email", p.emailNote);
        tdMail.dataset.label = "Email";
        tr.appendChild(tdMail);

        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      section.appendChild(table);
      view.appendChild(section);
    });
  }).catch(function(err){
    view.textContent = "";
    var block = el("div", "state-block");
    block.appendChild(el("h2", null, "Couldn't load contacts"));
    block.appendChild(el("p", null, String(err && err.message ? err.message : err)));
    view.appendChild(block);
  });
}

/* ---------------- Instructions view (F8) ---------------- */

function instrSection(heading, bodyBuilder){
  var s = el("div", "instr-section");
  s.appendChild(el("h2", null, heading));
  bodyBuilder(s);
  return s;
}
function instrP(parent, text){ parent.appendChild(el("p", null, text)); }
function instrCode(text){ return el("code", null, text); }
function pWithCode(parent, parts){
  var p = el("p");
  parts.forEach(function(part){
    if (typeof part === "string") p.appendChild(document.createTextNode(part));
    else p.appendChild(part);
  });
  parent.appendChild(p);
}

function openInstructions(){
  showView("instructions");
  var view = document.getElementById("instructions-view");
  view.textContent = "";
  view.appendChild(buildInstructions());
}

function buildInstructions(){
  var frag = document.createDocumentFragment();

  var back = el("button", "instr-back");
  back.type = "button";
  back.appendChild(icon("back"));
  back.appendChild(document.createTextNode(" Back to index"));
  back.addEventListener("click", closeInstructions);
  frag.appendChild(back);

  frag.appendChild(el("h1", null, "Instructions"));

  frag.appendChild(instrSection("1. What this is", function(s){
    instrP(s, "UPInfradesk is an independent index of public Uttar Pradesh infrastructure and investment-facilitation resources — GIS portals, investor systems, policy documents, and central-agency links. It is not an official government system, and it stores no passwords or credentials of any kind.");
  }));

  frag.appendChild(instrSection("2. Installing on your phone", function(s){
    instrP(s, "iOS: open this page in Safari (Chrome on iOS cannot install PWAs) → Share → Add to Home Screen.");
    instrP(s, "Android: open this page in Chrome → Menu → Install app.");
  }));

  frag.appendChild(instrSection("3. Finding a link", function(s){
    instrP(s, "Use search — it matches titles, tags, notes, and, importantly, the data fields listed inside each resource’s detail panel. Typing “circle rate” or “spare capacity” will surface the right portal even if you don’t know its name. You can also browse by category, or check the Pinned strip at the top.");
    instrP(s, "The sidebar on the left lists every section with a count, and each one expands to show the individual resources inside it — click any entry to jump straight there instead of scrolling. On a phone it opens from the ☰ button and closes when you tap outside it, press Escape, or pick something. On a laptop it stays open, and the same button collapses it if you want the extra width.");
  }));

  frag.appendChild(instrSection("4. Reading the detail panel", function(s){
    pWithCode(s, ["On desktop, hover a card for a moment to open its detail panel. On mobile, tap the chevron. On keyboard, focus a card and press ", instrCode("i"), " or ", instrCode("?"), "; ", instrCode("Escape"), " closes it. The panel explains what the resource actually contains, when to reach for it, and what to watch out for — read this before you tap through."]);
  }));

  frag.appendChild(instrSection("5. Departments & contacts", function(s){
    instrP(s, "The people icon in the header opens a department-wise directory of Invest UP — head office numbers, and for each cell the officer, designation, phone and email. Numbers and addresses are tappable.");
    instrP(s, "It is a transcription of the official Invest UP Who's Who and Contact Us pages, and it shows exactly which page each part came from and when that page was last updated. Anything the source does not publish reads “Not available” rather than being guessed. Postings change without the official page being updated, so confirm by phone before anything that matters.");
  }));

  frag.appendChild(instrSection("6. Reading the badges", function(s){
    var ul = el("ul", "instr-badge-list");
    var items = [["lock","Login required"],["desktop","Desktop-only — unusable or unreliable on a phone"],["verify","Verify — due for a recheck"],["stale","Stale — significantly overdue; treat with caution"]];
    items.forEach(function(it){
      var li = el("li");
      li.appendChild(icon(it[0]));
      li.appendChild(document.createTextNode(it[1]));
      ul.appendChild(li);
    });
    s.appendChild(ul);
  }));

  frag.appendChild(instrSection("7. Using the Policy table", function(s){
    instrP(s, "Click any column header to sort. Amendments are nested under their parent policy. The document icon opens the file directly for most rows; a distinct icon marks rows that land on a landing page instead, meaning one extra click is coming.");
  }));

  frag.appendChild(instrSection("8. Pinning", function(s){
    instrP(s, "Tap the pin icon on any card to add it to the Pinned strip. Pins are stored only on this device, in this browser — they are not synced anywhere, and are lost if browser data is cleared.");
  }));

  frag.appendChild(instrSection("9. When a link is broken", function(s){
    pWithCode(s, ["Check the badge first. If it’s flagged, try the parent domain, or that portal’s own search. If you find a working replacement, the fix is a one-line edit to ", instrCode("links.json"), " and a commit."]);
  }));

  frag.appendChild(instrSection("10. Monthly maintenance", function(s){
    pWithCode(s, ["Run ", instrCode("node tools/check-links.mjs"), " locally. Open every amber/red link and confirm the content is still current, not just that the URL resolves — no script can verify that. Update ", instrCode("lastVerified"), ", mark superseded entries ", instrCode("deprecated"), ", bump ", instrCode("lastReviewed"), ", and commit."]);
  }));

  frag.appendChild(instrSection("11. Adding a link", function(s){
    pWithCode(s, ["Add an entry to the ", instrCode("links"), " array in ", instrCode("links.json"), " with at minimum: ", instrCode("id"), ", ", instrCode("title"), ", ", instrCode("url"), ", ", instrCode("category"), ", ", instrCode("tags"), ", ", instrCode("note"), ", ", instrCode("detail.owner"), ", ", instrCode("detail.whatItGives"), ", ", instrCode("authRequired"), ", ", instrCode("mobileFriendly"), ", ", instrCode("lastVerified"), ". Populate ", instrCode("detail.dataFields"), " by actually opening the resource once — that field is what stops exploratory clicking, and it is worth the extra two minutes. Never host a copy of a document; link to the source only, and never let anything internal into this public repository."]);
  }));

  frag.appendChild(instrSection("12. Offline behaviour", function(s){
    instrP(s, "The index itself works offline once you’ve opened it while connected. The destinations it links to do not — every one of them needs a live connection.");
  }));

  frag.appendChild(instrSection("13. Troubleshooting", function(s){
    pWithCode(s, ["Stale-looking icon after an update: force-quit and reopen the app; if that doesn’t clear it, remove and re-add it to your home screen."]);
    pWithCode(s, ["Empty search results: check whether “flagged only” is switched on."]);
    pWithCode(s, ["Blank page: most likely a syntax error in ", instrCode("links.json"), " — the app should show an error state with the fetch status instead; if you see a truly blank page, that’s a bug worth reporting."]);
  }));

  frag.appendChild(instrSection("14. Passwords", function(s){
    pWithCode(s, ["This tool stores no credentials, by design — anything a page can store, any script on that page can read, and ", instrCode("localStorage"), " is plain text. Use your browser’s or OS’s password manager for the portals themselves; it is already encrypted at the OS level and already handles these logins."]);
  }));

  return frag;
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
</body>
</html>
